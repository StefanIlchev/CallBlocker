[versions]

#noinspection UnusedVersionCatalogEntry
versionCode = "43"

# https://developer.android.com/tools/releases/build-tools
#noinspection UnusedVersionCatalogEntry
buildToolsVersion = "37.0.0"

# https://developer.android.com/tools/releases/platforms
#noinspection UnusedVersionCatalogEntry
compileSdk = "37"
#noinspection UnusedVersionCatalogEntry
minSdk = "28"

[libraries]

# https://mvnrepository.com/artifact/androidx.activity/activity-compose
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }

# https://mvnrepository.com/artifact/androidx.compose.material3/material3
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version = "1.4.0" }

# https://mvnrepository.com/artifact/androidx.compose.material/material-icons-core
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }

# https://mvnrepository.com/artifact/androidx.compose.ui/ui
androidx-compose-ui = { module = "androidx.compose.ui:ui", version = "1.12.0" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version = "1.12.0" }

# https://mvnrepository.com/artifact/com.mikepenz/aboutlibraries-compose-m3
aboutlibraries = { module = "com.mikepenz:aboutlibraries-compose-m3", version = "15.1.0" }

# https://mvnrepository.com/artifact/androidx.test/runner
androidTest-runner = { module = "androidx.test:runner", version = "1.7.0" }

# https://mvnrepository.com/artifact/androidx.test.ext/junit-ktx
androidTest-junit = { module = "androidx.test.ext:junit-ktx", version = "1.3.0" }

# https://mvnrepository.com/artifact/androidx.test.uiautomator/uiautomator
androidTest-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.4.0" }

# https://mvnrepository.com/artifact/junit/junit
test-junit = { module = "junit:junit", version = "4.13.2" }

[plugins]

# https://mvnrepository.com/artifact/com.android.tools.build/gradle
android-application = { id = "com.android.application", version = "9.3.1" }
android-library = { id = "com.android.library", version = "9.3.1" }

# https://mvnrepository.com/artifact/org.jetbrains.kotlin.plugin.compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version = "2.4.10" }

# https://mvnrepository.com/artifact/com.mikepenz.aboutlibraries.plugin.android/com.mikepenz.aboutlibraries.plugin.android.gradle.plugin
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version = "15.1.0" }

# https://mvnrepository.com/artifact/org.ajoberstar.grgit/org.ajoberstar.grgit.gradle.plugin
grgit = { id = "org.ajoberstar.grgit", version = "5.3.3" }

# https://mvnrepository.com/artifact/com.github.breadmoirai.github-release/com.github.breadmoirai.github-release.gradle.plugin
github-release = { id = "com.github.breadmoirai.github-release", version = "2.5.2" }
